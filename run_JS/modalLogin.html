<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    #rloginModal .modal-content {
    width: 300px;
    margin: 50px auto;
    padding: 20px;
    border-radius: 10px;
    background: #fff;
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 10px; /* 입력창 간격 */
}

.login-form input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.login-form button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    background: #4a6cf7;
    color: white;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
}

.login-form button:hover {
    background: #3c59d6;
}

</style>
<body>
   <div id="rloginModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>로그인</h3>

        <form action="/rlogin" method="post" class="login-form">
            <input type="text" id="trainerId" name="trainerId" placeholder="ID" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">로그인</button>
        </form>
    </div>
</div>
 
</body>
</html>
