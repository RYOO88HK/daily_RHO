<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
  
</head>
<style>

      body {
      height: 100vh;
   }

   .tab ul {
      display: flex;
      justify-content: space-between;
      padding: 0;
      margin: 0;
      list-style: none;
      border: 1px solid #441111;
   }

   .tab li {
      margin-right: 10px;
   }

   .tab li.on a {
      font-weight: bold;
      color: #127e5d;
   }

   .tab_content {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding-bottom: 40px;
      
   }


.tab_con_item {
    width: 200px;
    display: flex;
    flex-direction: column;
    border: 1px solid #ccc;   /* 카드 테두리 */
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
}

/* 카드 내용 감싸는 컨테이너 */
.tab_con_item a {
    display: flex;
    flex-direction: column;
}

/* 이미지 */
.tab_con_item img {
    width: 100%;
    height: auto;
    object-fit: cover;
}

/* 텍스트 영역 */
.card_info {
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 10px;   /* 이미지와 text 사이 간격 */
    border-top: 1px solid #eee;  /* 카드 안에서 텍스트 구분선 optional */
}



   .display-table {
      width: 900px;  /* 카드와 탭이 공유하는 폭*/
      margin: 0 auto; /* 화면 가운데 정렬*/
   }
   .tab {
      border: 1px solid #ccc;
      margin-bottom: 30px;

   }
   .tab li {
      border-right: 1px solid #ccc;
      padding: 15px 25px;
      text-align: center;
   }

   .tab li:last-child {
      border-right: none;
   }

 .mbtn  {
   display: flex;
   justify-content: flex-end;
   gap: 10px;
   margin-top: 0px;
   margin-bottom: 20px;
   padding-top: 10px;
 }

 .mbtn button {
   padding: 8px 14px;
   font-size: 14px;
   border: 0.5px solid #bbb;
   border-radius: 6px;

   background: white;
   cursor: pointer;
 }
 .mbtn button :hover{
   background: #127e5d;
 }

 h2 {
    font-size:  28px;
    text-align: center;
    margin-top: 20px;
    margin-bottom: 20px;
 }
 

 .modal {
    display: none; /* 기본 숨김 */
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}


 .modal-content {
     background-color: #fff;
     padding: 20px;
     border-radius: 8px;
     width: 300px;
     max-width: 90%;
 }
 
  
</style>

<body>

   <h2>프로그램 소개</h2>
   <div class="mbtn">
      <button type="submit" class="mbtn" onclick="location.href='/'">Home</button>
      <button type="button" class="mbtn" id="rloginBtn">로그인 </button>
      <button type="button" class="mbtn" onclick="location.href='/trainerRegister'">회원가입</button>
   </div>

   <div class="display-table">
      <div class="tab" >
         <ul>
            <li class="on" data-type="special">원데이 러닝 </a></li>
            <li data-type="short"> 1:1 개인러닝 </li>
            <li data-type="long"> 일반 러닝 </li>
            <li data-type="oneday"> 러닝 자세교정 </li>
            <li> <a href=""> 전체보기 </a></li>
         </ul>
      </div>


      <div class="tab_content">

         <div class="tab_con_item" th:each="course:${course}"  data-category="special" >
            <a href="/AcademyDetail.html?id=id_s1">
               <img th:src="${course.prPhotoUrl}">
               <div class="card_info">
                  <span th:text="${course.title}"> </span>
                  <span th:text="'('+${course.location}+')'"></span>
                  <span th:text="${course.startDate}"></span>
                  <span th:text="${course.price}">원</span>
               </div>
            </a>
         </div> <!---Top card div-->

      </div> <!--tab_content-->
   </div>
   
   <!--로그인 모달-->
<div id="rloginModal" class="modal">
	<div class="modal-content">
		<span class="close">&times;</span>
		<h3> 로그인</h3>
		<form action="" method="post">
			<label for="trainerId">ID</label>
			<input type="text" id="trainerId" name="trainerId" required>
			<label for="password">Password</label>
			<input type="password" id="password" name="password" required>
			<button type="submit">로그인</button>
		</form>

	</div>
</div>



<script>
   //탭클릭+ 해당 카테고리만 보이기
   document.querySelectorAll('.tab li').forEach(tab => {
      tab.addEventListener('click', () => {
         const type = tab.dataset.type;

         //디자인 변경

         //    document.querySelectorAll('.tab il').forEach (t=>t.classList.remove('on'));
         //      tab.classList.add('on');

         //카드 필터링
         document.querySelectorAll('.tab_con_item').forEach(item => {
            if (type === item.dataset.category) {
               item.style.display = "block";
            } else {
               item.style.display = "none";
            }
         });
      });
   });

   //모든 카드선택
   document.querySelectorAll('.tab_con_item').forEach(card => {
      card.addEventListener('click', () => {
         const detail = card.querySelector('.card_detail');

         //다른 카드 열려있으면 닫기
         document.querySelectorAll('.card_detail').forEach(dd => {
            if (dd !== detail) dd.style.display = 'none';
         });

         //현재 카드 상세정보 토글
         if (detail.style.display === 'block') {
            detail.style.display = 'none';
         } else {
            detail.style.display = 'block'
         }

      });
   });



   document.querySelectorAll('.tab_con_item').forEach(card => {
      card.style.display = 'block';       // 카드 보이기
      const info = card.querySelector('.card_info');
      if (info) info.style.display = 'flex';
      const img = card.querySelector('img');
      if (img) img.style.display = 'block';

      const detail = card.querySelector('.card_detail');
      if (detail) detail.style.display = 'none';
   });

   document.addEventListener("DOMContentLoaded", function(){
	
  
 //모달가져오기
 const rloginModal = document.getElementById("rloginModal");
 
 // 로그인 버튼 
 const rloginBtn = document.getElementById("rloginBtn");
 
 // 닫기 버튼
 const rloginClose = rloginModal.querySelector(".close");
 
 //버튼 클릭 시 모달열기
 rloginBtn.addEventListener("click", function(e){e.preventDefault();
	rloginModal.style.display="block";	
 });
 
 // 닫기 버튼 클릭 모달닫기
 rloginClose.addEventListener("click", function(){
	rloginModal.style.display="none";
 });
 
 //모달 바깥 클릭시 닫기
 window.addEventListener("click", function(e){
	if(e.target===rloginModal){
		rloginModal.style.display="none";
	}
 }); 
  
 });  
   
   </script>


</body>
</html>
